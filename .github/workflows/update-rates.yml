# Daily USD-based FX snapshot for cagd.as/rates.
#
# Writes docs/data/rates.json (served at https://files.cagd.as/data/rates.json),
# which the rates.js bundle reads on the /rates page. Source updates ~00:00 UTC;
# we run at 04:17 UTC so we always grab the fresh day's rates. Commits only when
# the numbers actually change.
#
# SSOT: sites/cagdas/cron/update-rates.yml in the monorepo. The live copy lives in
# this serving repo at .github/workflows/update-rates.yml — keep them in sync.
name: Update currency rates

on:
  schedule:
    - cron: "17 4 * * *" # daily 04:17 UTC
  workflow_dispatch: {} # manual run (also used for the first seed)

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # @v6 runs on Node 24 (v4 was Node-20-deprecated). fetch-depth: 0 → full
      # history so the rebase-before-push below can never fail on a shallow clone.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22" # active LTS (Node 20 is past end-of-life)

      - name: Fetch latest rates
        run: node scripts/fetch-rates.mjs

      - name: Commit if changed
        run: |
          git add docs/data/rates.json
          if git diff --cached --quiet; then
            echo "No rate changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(rates): daily FX update [skip ci]"
          # The bare push raced with concurrent pushes to main (manual deploys,
          # other crons) and was rejected non-fast-forward. Rebase onto the latest
          # main and retry — rates.json is the only file this job writes and the
          # concurrency group serialises runs, so the rebase never conflicts.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}) — rebasing onto origin/main and retrying."
            git pull --rebase origin main
          done
          echo "::error::Push still failing after 5 rebase attempts."
          exit 1
