# Sitemap for cagd.as, re-hosted on GitHub Pages.
#
# Fetches Webflow's published sitemap (https://cagd.as/sitemap.xml), normalises it,
# and writes docs/sitemap.xml (served at https://files.cagd.as/sitemap.xml). Runs
# every 12 hours; commits only when the URL set actually changes.
#
# For Google to use this CROSS-HOST sitemap for cagd.as URLs, cagd.as/robots.txt
# must declare:  Sitemap: https://files.cagd.as/sitemap.xml
#
# SSOT: sites/cagdas/cron/update-sitemap.yml in the monorepo. The live copy lives in
# this serving repo at .github/workflows/update-sitemap.yml — keep them in sync.
name: Update sitemap

on:
  schedule:
    - cron: "41 */12 * * *" # every 12h at :41 (00:41 + 12:41 UTC), off the congested top-of-hour
  workflow_dispatch: {} # manual run (also used for the first seed)

permissions:
  contents: write

concurrency:
  group: update-sitemap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # @v6 runs on Node 24 (v4 was Node-20-deprecated). fetch-depth: 0 → full
      # history so the rebase-before-push below can never fail on a shallow clone.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22" # active LTS (Node 20 is past end-of-life)

      - name: Generate sitemap from Webflow's published sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit if changed
        run: |
          git add docs/sitemap.xml
          if git diff --cached --quiet; then
            echo "No sitemap changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sitemap): refresh from Webflow [skip ci]"
          # Same rebase-before-push retry as update-rates.yml: the bare push can race
          # with concurrent pushes to main (manual deploys, the rates cron) and get
          # rejected non-fast-forward. sitemap.xml is the only file this job writes and
          # the concurrency group serialises runs, so the rebase never conflicts.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}) — rebasing onto origin/main and retrying."
            git pull --rebase origin main
          done
          echo "::error::Push still failing after 5 rebase attempts."
          exit 1
